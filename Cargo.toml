[package]
name = "phpz"
version = "0.1.0"
edition = "2021"
authors = ["Carlos Varela <caduvarela@gmail.com>"]
description = "A simple PHP version manager"
license = "MIT"
repository = "https://github.com/CaduVarela/phpz"
readme = "README.md"
keywords = ["php", "version-manager", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
