[package]
name = "phpz"
version = "0.6.0"
edition = "2021"
authors = ["Carlos Varela <caduvarela@gmail.com>"]
description = "PHP version manager with per-project versions and extensions. No sudo, no compiler."
license = "MIT"
repository = "https://github.com/CaduVarela/phpz"
readme = "README.md"
homepage = "https://github.com/CaduVarela/phpz"
keywords = ["php", "version-manager", "cli", "nvm", "extensions"]
exclude = [".github", "docs/assets", "packaging"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
