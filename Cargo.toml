[package]
name = "phpz"
version = "0.1.0"
edition = "2021"
authors = ["Carlos Varela <caduvarela@gmail.com>"]
description = "A simple PHP version manager for Windows and Linux"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
